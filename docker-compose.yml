services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL-}
    depends_on:
      postgres:
        condition: service_started

  postgres:
    image: postgres:18.7-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fla_chess}
      POSTGRES_USER: ${POSTGRES_USER:-fla_chess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fla_chess}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fla_chess} -d ${POSTGRES_DB:-fla_chess}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
